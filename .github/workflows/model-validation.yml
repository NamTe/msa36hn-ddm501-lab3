name: Model Validation

on:
  push:
    paths:
      - 'models/**'
      - 'pipeline/**'

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==80.9.0" wheel "Cython==0.29.37" "numpy==1.26.2"
          python -m pip install --no-build-isolation --no-deps "scikit-surprise==1.1.3"
          pip install -r requirements.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Validate model performance
        run: |
          python -c "
          from app.model import MovieRatingModel
          model = MovieRatingModel()
          assert model.is_loaded(), 'Model failed to load'
          print('Model validation passed!')
          "
