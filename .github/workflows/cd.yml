# =============================================================================
# CD Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Complete this workflow configuration (BONUS)
# =============================================================================

name: CD Pipeline

# =============================================================================
# Configure Triggers
# =============================================================================
# This workflow should run when:
# - A version tag is pushed (e.g., v1.0.0, v1.2.3)

on:
  push:
    tags:
      - 'v*'

jobs:
  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Find successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          RUN_ID=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f event=push -f status=success \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run for $COMMIT_SHA. Wait for branch CI to pass, then retry CD."
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download model trained by CI
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Docker image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:latest
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}

      # Create GitHub Release (BONUS)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}
          draft: false
          prerelease: false

  # ===========================================================================
  # Deploy to Staging (BONUS)
  # ===========================================================================
  # This job would deploy to a staging environment
  # In a real scenario, this might deploy to AWS, GCP, Azure, etc.

  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, linux, x64, staging]
    needs: [build-and-push]
    environment: staging

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Deploy to staging
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          if docker container inspect movie-rating-staging >/dev/null 2>&1; then
            docker rm -f movie-rating-staging
          fi
          docker run -d --restart unless-stopped -p 8001:8000 --name movie-rating-staging "$IMAGE"

  # ===========================================================================
  # Deploy to Production (BONUS)
  # ===========================================================================
  # This job would deploy to production after staging approval

  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64, production]
    needs: [deploy-staging]
    environment: production

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Deploy to production
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          if docker container inspect movie-rating-production >/dev/null 2>&1; then
            docker rm -f movie-rating-production
          fi
          docker run -d --restart unless-stopped -p 8000:8000 --name movie-rating-production "$IMAGE"
